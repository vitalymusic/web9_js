<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
             <h1 class="text-center my-5">Filmu katalogs</h1>
        </header>
        <main class="container">
            <div class="search my-5">
                <label for="">Meklēt filmu:</label>
                <input type="text" name="" id="searchInput">
                
            </div>
            <div class="movies d-flex flex-wrap justify-content-center gap-3">


            </div>
                


        </main>

      
        
        <!-- Modal Body -->
        <!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
        <div
            class="modal fade"
            id="modalId"
            tabindex="-1"
            data-bs-backdrop="static"
            data-bs-keyboard="false"
            
            role="dialog"
            aria-labelledby="modalTitleId"
            aria-hidden="true"
        >
            <div
                class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-xl"
                role="document"
            >
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitleId">
                            Modal title
                        </h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                        ></button>
                    </div>
                    <div class="modal-body">Body</div>
                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Close
                        </button>
                        <button type="button" class="btn btn-primary">Save</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Optional: Place to the bottom of scripts -->
       
        
        
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

         <script>
            const myModal = new bootstrap.Modal(
                document.getElementById("modalId")
            );
        </script>

        <script>
            const moviesDiv = document.querySelector('.movies');
            const error = "Ieraktiet vismaz 3 simbolus";
            const searchInput = document.querySelector('#searchInput');

            
            searchInput.oninput = ()=>{
                getMovies(searchInput.value);
            }

            async function getMovies(search){
                    if(search===undefined || search.length<3){
                        showMovies(error);
                        return false;
                    }
                    resp = await fetch(`https://www.omdbapi.com/?apikey=fd98b71a&s=${search}`)
                    let data = await resp.json();
                    showMovies(data.Search);
            }
            function showMovies(data){
                if(typeof data === 'string'){
                     moviesDiv.innerHTML = `
                        <div class="alert alert-danger">
                            ${data}
                        </div>   
                     `;
                     return false;
                }
                console.log(data);
                moviesDiv.innerHTML = "";
                data.forEach((item,i)=>{
                    moviesDiv.innerHTML+=`
                        <div class="card border border-primary" style="width:300px">
                            <img class="img-fluid" src="${item.Poster}" alt="Title" style="height:200px; object-fit:cover"/>
                            <div class="card-body">
                                <h4 class="card-title text-center " onclick="showCard('${item.imdbID}')">${item.Title}</h4>
                                <p class="card-text text-center">${item.Year}</p>
                            </div>
                        </div>
                    `;


                })
            }


            function showCard(movieID){
                alert(movieID);

            }


            // https://www.omdbapi.com/?i=tt3896198&apikey=fd98b71a
        </script>
    </body>
</html>
