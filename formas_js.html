<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formu apstrāde ar JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</head>

<body>

    <form action="">
        <div class="mb-3">
            <label for="name" class="form-label">Vārds</label>
            <input type="text" class="form-control" name="name" id="name" aria-describedby="helpId" placeholder="" />
            <small id="helpId" class="form-text text-body-secondary">Help text</small>
        </div>
        <div class="mb-3">
            <label for="surname" class="form-label">Uzvārds</label>
            <input
                type="text"
                class="form-control"
                name="surname"
                id="surname"
                aria-describedby="helpId"
                placeholder=""
            />
            <small id="helpId" class="form-text text-body-secondary"
                >Help text</small
            >
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Epasts</label>
            <input
                type="email"
                class="form-control"
                name="email"
                id="email"
                aria-describedby="emailHelpId"
                placeholder="abc@mail.com"
            />
            <small id="emailHelpId" class="form-text text-body-secondary"
                >Help text</small
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Jaunā parole</label>
            <input
                type="password"
                class="form-control"
                name="password"
                id="password"
                placeholder=""
            />
        </div>
        <div class="mb-3">
            <label for="password_repeat" class="form-label">Atkārtot paroli</label>
            <input
                type="password"
                class="form-control"
                name="password_repeat"
                id="password_repeat"
                placeholder=""
            />
        </div>
        
        
        




    </form>

</body>

</html>
