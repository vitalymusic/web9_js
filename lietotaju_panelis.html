<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
    <header>
        <!-- place navbar here -->
        <h1 class="text-center my-5">Sistēmas lietotāji</h1>
    </header>
    <main class="container">
        <table class="table table-striped">
            <thead>
                <td>Vārds</td>
                <td>Uzvārds</td>
                <td>Epasts</td>
                <td>Tālrunis</td>
                <td>Darbības</td>
            </thead>
            <tbody></tbody>
            <tfoot>

            </tfoot>
        </table>


        <!-- Modal trigger button -->

        <!-- Modal Body -->
        <!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
        <div class="modal fade" id="modal1" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
            role="dialog" aria-labelledby="modalTitleId" aria-hidden="true">
            <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-xl" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitleId">
                            Modal title
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">Body</div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Optional: Place to the bottom of scripts -->
        <script>
          
        </script>



    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        let tbody = document.querySelector('tbody');
        getUsers();
        modalBody = document.querySelector('.modal-body');
        async function getUsers() {
            resp = await fetch('https://dummyjson.com/users');
            data = await resp.json();
            tbody.innerHTML = "";
            if (data.users.length > 0) {
                data.users.forEach((user) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${user.firstName}</td>
                            <td>${user.lastName}</td>
                            <td>${user.email}</td>
                            <td>${user.phone}</td>
                            <td>
                                <button class="btn btn-primary openUser" data-user_id="${user.id}">Skatīt</button>
                            </td>
                        </tr>    
                    `;
                })
            }

         userModal();
        }

        async function userModal() {
            const myModal = new bootstrap.Modal(document.getElementById("modal1")
            );
            let userButtons = document.querySelectorAll('.openUser');

            for(button of userButtons){
                button.addEventListener("click", async(e)=>{
                    userID = e.target.dataset.user_id;
                    resp = await fetch(`https://dummyjson.com/users/${userID}`);
                    userData = await resp.json();
                    modalBody.innerHTML = "";
                    htmlOut = "";
                    for(field in userData){
                        htmlOut+=`
                            <p>${field} - ${userData[field]}</p>
                        `;
                    }
                    modalBody.innerHTML = htmlOut;
                    myModal.show();
                })

                 
            }



           

        }
        
    </script>
</body>

</html>
