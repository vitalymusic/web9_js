<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .active{
            display: block;
            -webkit-animation:fade-in-fwd .6s cubic-bezier(.39,.575,.565,1.000) both;animation:fade-in-fwd 1s cubic-bezier(.39,.575,.565,1.000) both
        }

        .hidden{
            display: none;
        }
        .activeBtn{
            background-color: rgb(146, 202, 250);
        }
        .tabBtns a{
            padding: 10px;
            cursor: pointer;
        }


        /* ----------------------------------------------
 * Generated by Animista on 2026-10-8 20:30:1
 * Licensed under FreeBSD License.
 * See http://animista.net/license for more info. 
 * w: http://animista.net, t: @cssanimista
 * ---------------------------------------------- */

@-webkit-keyframes fade-in-fwd{0%{-webkit-transform:translateZ(-80px);transform:translateZ(-80px);opacity:0}100%{-webkit-transform:translateZ(0);transform:translateZ(0);opacity:1}}@keyframes fade-in-fwd{0%{-webkit-transform:translateZ(-80px);transform:translateZ(-80px);opacity:0}100%{-webkit-transform:translateZ(0);transform:translateZ(0);opacity:1}}





        /* akordeons */
        .accordeonItem a{
            display: block;
            padding: 20px;
            background-color: aliceblue;
            cursor: pointer;
        }

        .accordeonItem div{
            border:2px solid aliceblue;
            min-height: 100px;
            padding: 20px;

        }


    </style>
</head>
<body>  
    <div class="tabs">
        <div class="tabBtns">
            <a data-tab="tab1">Tab1</a>
            <a data-tab="tab2">Tab2</a>
            <a data-tab="tab3">Tab3</a>
        </div>
        <div class="tabContent">
            <div id="tab1">
                <h3>Pirmais saturs</h3>
                <img src="https://picsum.photos/id/3/500" alt="">
            </div>
            <div id="tab2">
                <h3>Otrais saturs</h3>
                <img src="https://picsum.photos/id/10/500" alt="">
            </div>
            <div id="tab3">
                <h3>Trešais saturs</h3>
                <img src="https://picsum.photos/id/20/500" alt="">
            </div>

        </div>



    </div>


    <div class="accordeon">
        <div class="accordeonItem">
            <a data-acc="ac1">Pirmā sadaļa</a>
            <div id="ac1">
                <h3>saturs1</h3>
                <img src="https://picsum.photos/id/45/200" alt="">
            </div>
        </div>
        <div class="accordeonItem">
            <a data-acc="ac2">Otrā sadaļa</a>
            <div id="ac2">
                <h3>saturs2</h3>
                <img src="https://picsum.photos/id/46/200" alt="">
            </div>
        </div>
        <div class="accordeonItem">
            <a data-acc="ac3">Trešā sadaļa</a>
            <div id="ac3">
                <h3>Saturs3</h3>
                <img src="https://picsum.photos/id/47/200" alt="">
            </div>
        </div>

    </div>

    

    <script>
        let btns = document.querySelectorAll('.tabBtns a');
        let tabContent = document.querySelectorAll('.tabContent div');


        for(btn of btns){
            btn.onclick = (e)=>{
               for(btn of btns){
                    btn.classList.remove('activeBtn');
               }

               for(tab of tabContent){
                    tab.classList.add('hidden');
                    tab.classList.remove('active');
               }
               e.target.classList.add('activeBtn');
               let dataAttr = e.target.dataset.tab;
               document.querySelector("#"+dataAttr).classList.replace('hidden','active')
            }
        }

        btns[0].click();




        // Akordeons


        let accBtns = document.querySelectorAll('.accordeonItem a');
        let accDivs = document.querySelectorAll('.accordeonItem div');

        function pasleptDiv(){
                 for(accDiv of accDivs){
                    accDiv.style.display = "none";
                }
               }


        for(btn of accBtns){
            btn.onclick = (e)=>{
               pasleptDiv();
                document.querySelector('#'+e.target.dataset.acc).style.display="block";

            }
        }

        // accBtns[0].click();
        pasleptDiv();

    </script>
</body>
</html>
